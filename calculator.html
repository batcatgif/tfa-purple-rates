<!DOCTYPE html>
<html>
<head>
    <title>Rainbow Message</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
        }

        .rainbow {
            font-size: 4rem;
            font-weight: bold;
            background: linear-gradient(
                90deg,
                red,
                orange,
                yellow,
                green,
                blue,
                indigo,
                violet
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="rainbow">You are gay</div>
</body>
</html>
